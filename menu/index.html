    <script>
        // ── Render items from products.js ──────────────────────────────
        function renderMenuItems(products) {
            const grid = document.getElementById('menu-grid');
            if (!grid) return;
            grid.innerHTML = products.map(p => {
                const badge = p.badge ? `<div class="absolute top-2 left-2"><span class="inline-flex items-center px-2 py-1 rounded bg-white/90 dark:bg-black backdrop-blur-sm text-[10px] font-bold text-espresso dark:text-white uppercase tracking-wider border border-border-cream dark:border-white/20">${p.badge}</span></div>` : '';
                const meta = p.meta ? `<span>•</span><span>${p.meta}</span>` : '';
                return `<div data-tags="${p.tags.join(' ')}" data-price="${p.price}" data-category="${p.category}" class="menu-item group relative flex flex-col sm:flex-row rounded-xl bg-white dark:bg-[#1a0d0f] border border-border-cream dark:border-white/5 hover:border-primary/20 overflow-hidden transition-all duration-300 hover:-translate-y-1 shadow-[0_4px_20px_rgba(0,0,0,0.03)] hover:shadow-[0_10px_30px_rgba(0,0,0,0.06)]">
                    <div class="w-full sm:w-48 md:w-56 shrink-0 h-56 sm:h-auto relative overflow-hidden">
                        <div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-110" style="background-image: url('${p.image}')"></div>
                        ${badge}
                    </div>
                    <div class="flex flex-col justify-between p-6 flex-1">
                        <div class="flex flex-col gap-2">
                            <div class="flex justify-between items-start gap-4">
                                <h3 class="text-xl font-bold text-espresso dark:text-white group-hover:text-primary transition-colors">${p.name}</h3>
                                <span class="text-primary font-bold text-lg">&#8377;${p.price.toFixed(2)}</span>
                            </div>
                            <p class="text-muted-espresso dark:text-gray-400 font-light text-sm leading-relaxed">${p.description}</p>
                        </div>
                        <div class="flex items-end justify-between mt-6">
                            <div class="flex gap-2 text-xs text-muted-espresso dark:text-gray-500">
                                <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">star</span> ${p.rating}</span>
                                ${meta}
                            </div>
                            <div class="product-action-container" data-id="${p.id}" data-name="${p.name.replace(/"/g,'&quot;')}" data-price="${p.price}" data-image="${p.image}"></div>
                        </div>
                    </div>
                </div>`;
            }).join('');
            if (typeof renderProductActions === 'function') renderProductActions();
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Show skeleton loaders while fetching
            const grid = document.getElementById('menu-grid');
            const skeletonCard = `
                <div class="skeleton-card flex flex-col sm:flex-row rounded-xl bg-white dark:bg-[#1a0d0f] border border-border-cream dark:border-white/5 overflow-hidden">
                    <div class="w-full sm:w-48 md:w-56 shrink-0 h-56 sm:h-auto bg-gray-200 dark:bg-white/5 animate-pulse"></div>
                    <div class="flex flex-col justify-between p-6 flex-1 gap-4">
                        <div class="h-5 bg-gray-200 dark:bg-white/5 rounded animate-pulse w-3/4"></div>
                        <div class="h-3 bg-gray-200 dark:bg-white/5 rounded animate-pulse w-full"></div>
                        <div class="h-3 bg-gray-200 dark:bg-white/5 rounded animate-pulse w-2/3"></div>
                        <div class="h-9 bg-gray-200 dark:bg-white/5 rounded-lg animate-pulse w-24 self-end"></div>
                    </div>
                </div>`;
            grid.innerHTML = skeletonCard.repeat(6);

            // Fetch products then render
            fetchProducts().then(products => {
                renderMenuItems(products);

                // ── Dietary Filter Pills ───────────────────────────────────
            const filterBtns = document.querySelectorAll('.filter-btn');
            const activeClass = ['border-primary/20', 'bg-primary/10', 'text-primary', 'font-bold'];
            const inactiveClass = ['border-border-cream', 'dark:border-white/10', 'bg-white', 'dark:bg-[#1a0d0f]', 'text-muted-espresso', 'dark:text-gray-400'];
            let activeCategory = 'all';
            let activeDietary = 'all';

            function applyFilters() {
                const allItems = Array.from(document.querySelectorAll('.menu-item'));

                // Step 1: fade + shrink everything out
                allItems.forEach(item => {
                    item.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
                    item.style.opacity    = '0';
                    item.style.transform  = 'scale(0.97)';
                });

                // Step 2: after fade-out, show/hide then stagger visible ones back in
                setTimeout(() => {
                    const visible = [];
                    allItems.forEach(item => {
                        const tags   = item.getAttribute('data-tags') || '';
                        const cat    = item.getAttribute('data-category') || '';
                        const okDiet = activeDietary === 'all' || tags.includes(activeDietary);
                        const okCat  = activeCategory === 'all' || cat === activeCategory;
                        if (okDiet && okCat) {
                            item.style.display = 'flex';
                            visible.push(item);
                        } else {
                            item.style.display = 'none';
                        }
                    });

                    // Stagger fade-in for visible items
                    visible.forEach((item, i) => {
                        setTimeout(() => {
                            item.style.opacity   = '1';
                            item.style.transform = 'scale(1)';
                        }, i * 45);
                    });
                }, 200);
            }

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => { b.classList.remove('active', ...activeClass); b.classList.add(...inactiveClass); });
                    btn.classList.remove(...inactiveClass);
                    btn.classList.add('active', ...activeClass);
                    activeDietary = btn.getAttribute('data-filter');
                    applyFilters();
                });
            });

            // ── Category Sidebar Links ─────────────────────────────────
            const catLinks = document.querySelectorAll('.category-link');
            const activeLinkClass = 'group flex items-center justify-between rounded-lg bg-primary/5 dark:bg-primary/10 px-4 py-3 border-l-4 border-primary shadow-sm';
            const inactiveLinkClass = 'group flex items-center justify-between rounded-lg px-4 py-3 text-muted-espresso dark:text-gray-400 hover:bg-white dark:hover:bg-white/5 hover:text-espresso dark:hover:text-white transition-all';

            catLinks.forEach(link => {
                link.addEventListener('click', e => {
                    e.preventDefault();
                    catLinks.forEach(l => { l.className = 'category-link ' + inactiveLinkClass; });
                    link.className = 'category-link ' + activeLinkClass;
                    activeCategory = link.getAttribute('data-category');
                    applyFilters();
                });
            });

            // ── Filter Toggle Button ───────────────────────────────────
            const filterToggleBtn = document.getElementById('filter-toggle-btn');
            const filterRow = document.getElementById('filter-buttons');
            if (filterToggleBtn && filterRow) {
                filterToggleBtn.addEventListener('click', () => {
                    const hidden = filterRow.classList.toggle('hidden');
                    filterToggleBtn.classList.toggle('border-primary/50', !hidden);
                    filterToggleBtn.classList.toggle('bg-primary/5', !hidden);
                });
            }

            // ── Sort Logic ────────────────────────────────────────────
            const sortBtn  = document.getElementById('sort-price-btn');
            const sortText = document.getElementById('sort-text');
            const sortIcon = document.getElementById('sort-icon');

            sortBtn.addEventListener('click', () => {
                const current = sortBtn.getAttribute('data-sort');
                const grid    = document.getElementById('menu-grid');
                const items   = Array.from(document.querySelectorAll('.menu-item'));

                if (current === 'default' || current === 'desc') {
                    items.sort((a, b) => parseFloat(a.getAttribute('data-price')) - parseFloat(b.getAttribute('data-price')));
                    sortBtn.setAttribute('data-sort', 'asc');
                    sortText.textContent = 'Low to High';
                    sortIcon.textContent = 'arrow_upward';
                } else {
                    items.sort((a, b) => parseFloat(b.getAttribute('data-price')) - parseFloat(a.getAttribute('data-price')));
                    sortBtn.setAttribute('data-sort', 'desc');
                    sortText.textContent = 'High to Low';
                    sortIcon.textContent = 'arrow_downward';
                }

                // Step 1: fade + shrink all cards out
                items.forEach(item => {
                    item.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
                    item.style.opacity    = '0';
                    item.style.transform  = 'scale(0.97)';
                    item.style.order      = '';
                });

                // Step 2: after fade-out, reorder in DOM then stagger fade-in
                setTimeout(() => {
                    items.forEach(item => grid.appendChild(item));
                    items.forEach((item, i) => {
                        setTimeout(() => {
                            item.style.opacity   = '1';
                            item.style.transform = 'scale(1)';
                        }, i * 45);
                    });
                }, 200);
            });
            }); // end fetchProducts().then()
        });
    </script>

</body>
