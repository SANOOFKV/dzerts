<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>dzerts - Checkout</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        :root {
            --primary: #d41132;
            --bg-main: #FDFBF7;
            --bg-sidebar: #F5F1E9;
            --text-main: #2C1810;
            --text-body: #333333;
            --text-muted: #6B5B55;
            --border-color: #E8E1D5;
        }

        .dark {
            --primary: #d41132;
            --bg-main: #221013;
            --bg-sidebar: #1a0d0f;
            --text-main: #ffffff;
            --text-body: #e5e5e5;
            --text-muted: #E6C9A8;
            --border-color: #39282b;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "var(--primary)",
                        "cream-bg": "var(--bg-main)",
                        "sidebar-cream": "var(--bg-sidebar)",
                        "espresso": "var(--text-main)",
                        "charcoal": "var(--text-body)",
                        "muted-espresso": "var(--text-muted)",
                        "border-cream": "var(--border-color)",
                    },
                    fontFamily: {
                        "display": ["Work Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
        }::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FDFBF7; 
            .dark & { background: #221013; }
        }
        ::-webkit-scrollbar-thumb {
            background: #E8E1D5; 
            border-radius: 4px;
            .dark & { background: #39282b; }
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d41132; 
        }
    </style>
    <!-- End Meta Pixel Code -->
</head>

<body
    class="bg-cream-bg text-charcoal font-display transition-colors duration-200 antialiased overflow-x-hidden selection:bg-primary selection:text-white">
    <!-- Header -->
    <header
        class="sticky top-0 z-50 w-full border-b border-border-cream dark:border-white/5 bg-cream-bg/95 backdrop-blur-md">
        <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-6 lg:px-8">
            <div class="flex items-center gap-2">
                <a href="../home/index.html" class="flex items-center gap-2 group">
                    <span
                        class="material-symbols-outlined text-muted-espresso dark:text-gray-400 group-hover:text-primary transition-colors">arrow_back</span>
                    <h1 class="text-2xl font-black tracking-tighter text-espresso dark:text-white lowercase">dzerts<span
                            class="text-primary">.</span></h1>
                </a>
            </div>
            <div class="flex items-center gap-4">
                <button id="theme-toggle"
                    class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-charcoal dark:text-white"
                    aria-label="Toggle Theme">
                    <span class="material-symbols-outlined dark:hidden">light_mode</span>
                    <span class="material-symbols-outlined hidden dark:block">dark_mode</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 sm:py-16 lg:px-8">
        <h1 class="text-3xl font-black text-espresso dark:text-white mb-8">Checkout</h1>

        <div class="lg:grid lg:grid-cols-12 lg:gap-x-12 lg:items-start">

            <!-- Customer Details Form -->
            <div class="lg:col-span-7">
                <section
                    class="bg-sidebar-cream dark:bg-[#1a0d0f] border border-border-cream dark:border-white/5 rounded-2xl p-6 md:p-8 shadow-sm mb-8 lg:mb-0">
                    <h2 class="text-xl font-bold text-espresso dark:text-white mb-6">Contact Details</h2>
                    <form id="customer-details-form" class="space-y-6">
                        <div>
                            <label for="customerName"
                                class="block text-sm font-medium text-espresso dark:text-gray-300">Full Name</label>
                            <input type="text" id="customerName" required
                                class="mt-1 block w-full rounded-md border border-border-cream dark:border-white/10 bg-white dark:bg-[#221013] px-3 py-2 text-espresso dark:text-white focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary shadow-sm focus:bg-white"
                                placeholder="John Doe">
                        </div>
                        <div>
                            <label for="customerPhone"
                                class="block text-sm font-medium text-espresso dark:text-gray-300">Phone Number (For
                                Order Lookup)</label>
                            <input type="tel" id="customerPhone" required
                                class="mt-1 block w-full rounded-md border border-border-cream dark:border-white/10 bg-white dark:bg-[#221013] px-3 py-2 text-espresso dark:text-white focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary shadow-sm focus:bg-white"
                                placeholder="9876543210">
                        </div>

                    </form>
                </section>
            </div>

            <!-- Order Summary -->
            <div class="lg:col-span-5">
                <section aria-labelledby="summary-heading"
                    class="bg-sidebar-cream dark:bg-[#1a0d0f] border border-border-cream dark:border-white/5 rounded-2xl p-6 md:p-8 shadow-sm sticky top-24">
                    <h2 id="summary-heading" class="text-xl font-bold text-espresso dark:text-white mb-6">Order
                        Summary
                    </h2>

                    <ul role="list" id="checkout-items"
                        class="divide-y divide-border-cream dark:divide-white/10 max-h-[40vh] overflow-y-auto pr-2 mb-6">
                        <!-- Items will be populated by JS -->
                    </ul>

                    <div class="space-y-4 pt-6 border-t border-border-cream dark:border-white/10">
                        <div class="flex items-center justify-between">
                            <dt class="text-sm text-muted-espresso dark:text-gray-400">Subtotal</dt>
                            <dd class="text-sm font-medium text-espresso dark:text-white" id="checkout-subtotal">
                                ₹0.00
                            </dd>
                        </div>
                        <div class="flex items-center justify-between">
                            <dt class="text-sm text-muted-espresso dark:text-gray-400">Service Fee</dt>
                            <dd class="text-sm font-medium text-espresso dark:text-white" id="checkout-shipping">
                                Free
                            </dd>
                        </div>
                        <div
                            class="flex items-center justify-between border-t border-border-cream dark:border-white/10 pt-4">
                            <dt class="text-base font-bold text-espresso dark:text-white">Order total</dt>
                            <dd class="text-xl font-bold text-primary" id="checkout-total">₹0.00</dd>
                        </div>
                    </div>

                    <div class="mt-8">
                        <button type="button" id="pay-now-btn"
                            class="w-full rounded-xl bg-primary px-4 py-4 text-base font-bold text-white shadow-sm hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex justify-center items-center gap-2">
                            Proceed to Payment <span class="material-symbols-outlined">arrow_forward</span>
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <style>
        .theme-transition,
        .theme-transition *,
        .theme-transition *::before,
        .theme-transition *::after {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1) !important;
            transition-delay: 0s !important;
        }
    </style>
    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        const enableThemeTransition = () => {
            htmlElement.classList.add('theme-transition');
            setTimeout(() => {
                htmlElement.classList.remove('theme-transition');
            }, 500);
        };

        function updateTheme(isDark) {
            if (isDark) {
                htmlElement.classList.add('dark');
                localStorage.theme = 'dark';
            } else {
                htmlElement.classList.remove('dark');
                localStorage.theme = 'light';
            }
        }

        function initTheme() {
            if (localStorage.theme === 'dark') {
                htmlElement.classList.add('dark');
            } else {
                htmlElement.classList.remove('dark');
                if (!('theme' in localStorage)) {
                    localStorage.theme = 'light';
                }
            }
        }

        initTheme();

        const toggleHandler = () => {
            enableThemeTransition();
            const isDark = htmlElement.classList.contains('dark');
            updateTheme(!isDark);
        };

        if (toggleBtn) toggleBtn.addEventListener('click', toggleHandler);
    </script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="../assets/js/checkout.js"></script>
</body>

</html>
